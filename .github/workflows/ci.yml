name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: read, packages: write, id-token: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Unit + pipeline tests (DirectRunner, TestStream, local files). No GCP access needed.
      - name: mvn verify
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: publish build errors as annotations
        if: failure()
        shell: bash
        run: |
          # Annotations are visible on the public run page without signing in.
          grep -E '^\[ERROR\]|FAILURE!|Tests run:.*(Failures: [1-9]|Errors: [1-9])|BUILD FAILURE|Caused by:|Exception' build.log \
            | grep -vE '^\[ERROR\] *$|Re-run Maven|full stack trace|Help 1|-> \[Help|For more information|To see the full' \
            | awk '!seen[$0]++' | head -n 45 | while IFS= read -r line; do
              msg="${line//'%'/'%25'}"; msg="${msg:0:900}"
              echo "::error title=build::${msg}"
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

  bundled-jar:   # fat jar for Flex Templates, only on main
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -DskipTests -Pdataflow package
      - run: ls -la target/*-bundled.jar
      - uses: actions/upload-artifact@v4
        with:
          name: tb-order-events-dataflow-bundled
          path: target/*-bundled.jar
          retention-days: 14
