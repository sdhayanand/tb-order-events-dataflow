name: hello-dataflow
# The simplest Dataflow job (StoreRevenueJob): upload a CSV, run it on Dataflow, print the result.
# Watch it while it runs: Console -> Dataflow -> Jobs -> hello-store-revenue-* (about 4-6 minutes).
on:
  workflow_dispatch: {}
permissions: { contents: read, id-token: write }

jobs:
  hello:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: '${{ vars.GCP_PROJECT_ID }}' }
      - name: unit test on the DirectRunner first (seconds, no GCP)
        run: mvn -B -ntp -q test -Dtest=StoreRevenueJobTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: run on Dataflow
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          JOB_NAME: hello-store-revenue-${{ github.run_number }}
        run: |
          set -o pipefail
          echo "::notice title=hello-dataflow::Job ${JOB_NAME} - Console -> Dataflow -> Jobs (region ${REGION})"
          bash scripts/run-hello.sh 2>&1 | tee "$RUNNER_TEMP/hello.log"
      - name: result + job summary as annotations
        if: always()
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          JOB_NAME: hello-store-revenue-${{ github.run_number }}
        run: |
          gsutil cat "gs://${PROJECT}-tb-otd-dataflow/hello/output/${JOB_NAME}/store-revenue.csv" 2>/dev/null \
            | while IFS= read -r l; do echo "::notice title=store-revenue.csv::$l"; done
          gcloud dataflow jobs list --region "$REGION" --project "$PROJECT" --filter="name=${JOB_NAME}" \
            --format='value(id,state,creationTime)' | while IFS= read -r l; do echo "::notice title=dataflow job::$l"; done
          grep -E "Exception|ERROR|QUOTA|denied" "$RUNNER_TEMP/hello.log" 2>/dev/null | head -n 5 \
            | while IFS= read -r l; do echo "::error title=hello-dataflow::${l:0:900}"; done
          exit 0
